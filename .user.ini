; File Upload Configuration for Salvation Admin
; Increase upload limits for gallery photos in obituaries

; Maximum size for individual files (20MB for high-quality photos)
upload_max_filesize = 20M

; Maximum size for POST requests (100MB for multiple gallery photos)
post_max_size = 100M

; Maximum execution time for uploads (5 minutes)
max_execution_time = 300

; Maximum input time for uploads (5 minutes)
max_input_time = 300

; Maximum number of files that can be uploaded simultaneously
max_file_uploads = 30

; Memory limit (keep existing)
memory_limit = 1028M