name: deploy

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main

jobs:
  build-assets:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Archive build output
        run: tar -czf build.tar.gz -C public build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build.tar.gz
          retention-days: 1

  deploy:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Upload built assets to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: salvationchurch.info
          username: ubuntu
          key: ${{ secrets.SALVATION_ADMIN_GIT_SECRET_KEY }}
          source: 'build.tar.gz'
          target: '/var/www/html/salvation-admin'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: salvationchurch.info
          username: ubuntu
          key: ${{ secrets.SALVATION_ADMIN_GIT_SECRET_KEY }}
          script: |
            set -e
            cd /var/www/html/salvation-admin
            git fetch origin main
            git reset --hard origin/main
            rm -rf public/build
            mkdir -p public/build
            tar -xzf build.tar.gz -C public
            rm -f build.tar.gz
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            sudo systemctl restart php8.4-fpm
            sudo systemctl reload nginx
